name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1
        env:
          WHATSAPP_GATEWAY_CONFIG_B64: ${{ secrets.WHATSAPP_GATEWAY_CONFIG_B64 }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: WHATSAPP_GATEWAY_CONFIG_B64
          script: |
            set -eu
            cd /var/www/html/aiwalas
            git fetch origin
            git reset --hard origin/main
            php scripts/configure-whatsapp-gateway.php --apply
            php spark migrate --all
            php -r 'echo "Photo processing GD (CLI): ".(extension_loaded("gd") ? "available" : "unavailable").PHP_EOL;'
            php -r 'foreach (["segoeui.ttf", "segoeuib.ttf"] as $font) { if (!function_exists("imagettfbbox") || imagettfbbox(40, 0, "resources/fonts/segoe-ui/".$font, "KOLASE KELAS 11PF1") === false) { exit(1); } } echo "Collage Segoe UI/FreeType: available".PHP_EOL;'
            systemctl is-active --quiet cron
            php scripts/configure-teacher-scheduler.php --apply
            php spark whatsapp:teacher-schedule
            scheduler_ready=0
            for attempt in $(seq 1 20); do
              if php spark whatsapp:teacher-schedule --status; then
                scheduler_ready=1
                break
              fi
              sleep 5
            done
            test "$scheduler_ready" -eq 1
